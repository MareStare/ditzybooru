name: e2e-screenshots

# A visual history of the site, not a test: rerecords the screenshots under
# frontend/e2e/__screenshots__ and pushes whatever changed. Run it by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: e2e-screenshots

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # oxipng, which scripts/e2e.sh uses to optimize the images.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tools
        with:
          path: tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/install/*.sh', 'scripts/utils/lib.sh') }}

      - if: steps.tools.outputs.cache-hit != 'true'
        run: ./scripts/install/oxipng.sh

      # The browser runs from a pinned Playwright container, see scripts/e2e.sh.
      - run: pnpm run e2e

      # `[skip ci]` keeps Cloudflare Workers Builds from redeploying the site
      # for a commit that only touches images.
      - name: Commit and push changed screenshots
        run: |
          git add --all -- frontend/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "No screenshot changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "chore(e2e): update screenshots [skip ci]"
          git push

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
