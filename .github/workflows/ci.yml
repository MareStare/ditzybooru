name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run fmt:check
      - run: pnpm run type-check
      - run: pnpm run lint
      - run: pnpm run knip
      - run: pnpm run build
      # The self-hosted target, so a break in it shows up here and not on deploy.
      - run: BUILD_TARGET=node pnpm run build

      # Structural a11y via axe-core plus a contrast audit over all 18
      # theme combinations. `playwright-core` ships no browser of its own, so
      # one is fetched here rather than on every `pnpm install`.
      # Keyed on the lockfile, which pins the Playwright version and thus the
      # Chromium build. `--with-deps` still installs the system libraries.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm run browsers:install --with-deps
      - run: pnpm run test

  # Compares screenshots of the site, rendered with placeholder images, with the
  # baselines committed under frontend/e2e/__screenshots__. A failure means the
  # UI changed: run `pnpm run e2e:update` and commit the changed images.
  e2e-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser runs from a pinned Playwright container, see scripts/e2e.sh.
      - run: pnpm run e2e

      - if: failure()
        uses: actions/upload-artifact@commit	cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # With no arguments, installs the toolchain `rust-toolchain.toml` pins.
      - run: rustup toolchain install

      # Caches the registry and `target`, keyed on the lockfile and toolchain.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - run: cargo test --locked

  # Check for typos in the repository based on a static dictionary
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The installed binary, keyed on the scripts that pin its version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tools
        with:
          path: tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/install/*.sh', 'scripts/utils/lib.sh') }}

      - if: steps.tools.outputs.cache-hit != 'true'
        run: ./scripts/install/typos.sh
      - run: echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"
      - run: typos
