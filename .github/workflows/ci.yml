name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

env:
  # Tools run only from the lockfile. `npx` fails for a package not installed.
  npm_config_yes: false

jobs:
  typescript-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci
      - run: npm run fmt:check
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build

      # Structural a11y via axe-core plus a contrast audit over all 18
      # theme combinations. `playwright-core` ships no browser of its own, so
      # one is fetched here rather than on every `npm ci`.
      - run: npm run browsers:install -- --with-deps
      - run: npm run test

  # Check for typos in the repository based on a static dictionary
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/install/typos.sh
      - run: typos
