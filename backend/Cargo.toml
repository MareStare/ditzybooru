[package]
name = "backend"

edition    = { workspace = true }
license    = { workspace = true }
publish    = false
repository = { workspace = true }
version    = { workspace = true }

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
axum   = "0.8.9"
tokio  = { version = "1.0", features = ["rt-multi-thread", "macros", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
jsonschema = { version = "0.59.0", default-features = false }
moka       = { version = "0.12.16", default-features = false, features = ["future"] }
reqwest    = { version = "0.13.5", default-features = false, features = ["cookies", "rustls"] }
scraper    = "0.27.0"
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
ammonia = "4.2.4"

[[bin]]
name = "api-verify"
path = "src/bin/api-verify.rs"
