# Deploy config for git-deploy-toolkit (github.com/WentTheFox/GitDeployToolkit).
# Sourced by the shared post-receive hook after each push to `deploy`, with cwd
# set to the worktree. The worktree has no `.git`, so the commit is read from
# the bare repo.

deploy_build() {
  # rustup installs here, and a hook's shell does not source the profile.
  export PATH="$HOME/.cargo/bin:$PATH"

  COMMIT_SHA=$(git --git-dir="$GIT_DIR" rev-parse --short=12 "$newrev")
  COMMIT_DATE=$(git --git-dir="$GIT_DIR" show --no-patch --format=%cI "$newrev")
  export COMMIT_SHA COMMIT_DATE

  pnpm install --frozen-lockfile
  # A standalone Node server instead of the default Cloudflare Workers build.
  BUILD_TARGET=node pnpm run build
  # `rust-toolchain.toml` makes rustup fetch the pinned toolchain on first use.
  cargo build --release --locked
}

deploy_restart() {
  pm2 startOrReload pm2.json
  pm2 save
}
